name: Build and Release APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/JJS-Studio-v1.0.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JJS-Studio-v1.0-APK
          path: release-artifacts/JJS-Studio-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release (On Push to Main/Master or Manual Trigger)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "JJS Studio v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### JJS Studio Android Release
            Automated build generated by GitHub Actions.
            
            - **Package**: `com.jjs.studio`
            - **Commit**: `${{ github.sha }}`
            - **Download**: Tap `JJS-Studio-v1.0.apk` below to install directly on Android.
          files: release-artifacts/JJS-Studio-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
